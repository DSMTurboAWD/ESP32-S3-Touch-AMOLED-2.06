# Display Configuration, Fonts, Local Assets, and Multi-Screen UI Pages

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: watch_mode
    type: bool
    restore_value: false
    initial_value: "true"
  - id: current_page_index
    type: int
    restore_value: false
    initial_value: "0"
  - id: screen_asleep
    type: bool
    restore_value: false
    initial_value: "false"
  - id: wifi_sleeping_offline
    type: bool
    restore_value: false
    initial_value: "false"
  - id: saved_brightness
    type: uint8_t
    restore_value: false
    initial_value: "180"
  - id: volume_step_index
    type: int
    restore_value: false
    initial_value: "2"
  - id: last_touch_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_tap_action_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: global_first_active_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: global_is_timer_active
    type: bool
    restore_value: false
  - id: global_first_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: global_is_timer
    type: bool
    restore_value: false
  - id: playing_internal_sound
    type: bool
    restore_value: false
    initial_value: "false"
  - id: on_air_local_state
    type: bool
    restore_value: false
    initial_value: "false"

