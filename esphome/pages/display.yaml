    hex: ${idle_illustration_background_color}
  - id: listening_color
    hex: ${listening_illustration_background_color}
  - id: thinking_color
    hex: ${thinking_illustration_background_color}
  - id: replying_color
    hex: ${replying_illustration_background_color}
  - id: loading_color
    hex: ${loading_illustration_background_color}
  - id: error_color
    hex: ${error_illustration_background_color}
  - id: active_timer_color
    hex: "26ed3a"
  - id: paused_timer_color
    hex: "3b89e3"

script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  lambda: return id(watch_mode);
                then:
                  - lambda: |
                      switch (id(current_page_index)) {
                        case 0:
                          id(main_display).show_page(clock_page);
                          break;
                        case 1:
                          id(main_display).show_page(weather_page);
                          break;
                        case 2:
                          id(main_display).show_page(meeting_page);
                          break;
                        case 3:
                          id(main_display).show_page(controls_page);
                          break;
                        default:
                          id(main_display).show_page(clock_page);
                          break;
                      }
                      id(main_display).update();
                else:
                  # Voice Assistant Overlay Mode
                  - if:
                      condition:
                        wifi.connected:
                      then:
                        - if:
                            condition:
                              api.connected:
                            then:
                              - lambda: |
                                  switch (id(voice_assistant_phase)) {
                                    case ${voice_assist_listening_phase_id}:
                                      id(main_display).show_page(listening_page);
                                      break;
                                    case ${voice_assist_thinking_phase_id}:
                                      id(main_display).show_page(thinking_page);
                                      break;
                                    case ${voice_assist_replying_phase_id}:
                                      id(main_display).show_page(replying_page);
                                      break;
                                    case ${voice_assist_error_phase_id}:
                                      id(main_display).show_page(error_page);
                                      break;
                                    case ${voice_assist_muted_phase_id}:
                                      id(main_display).show_page(muted_page);
                                      break;
                                    case ${voice_assist_not_ready_phase_id}:
                                      id(main_display).show_page(no_ha_page);
                                      break;
                                    case ${voice_assist_timer_finished_phase_id}:
                                      id(main_display).show_page(timer_finished_page);
                                      break;
                                    default:
                                      id(main_display).show_page(idle_page);
                                      break;
                                  }
                                  id(main_display).update();
                            else:
                              - display.page.show: no_ha_page
                              - component.update: main_display
                      else:
                        - display.page.show: no_wifi_page
                        - component.update: main_display
          else:
            - display.page.show: initializing_page
            - component.update: main_display

  # Shared top bar (Wi-Fi/HA dot, page header, and AXP2101 battery icon) + bottom nav dots
  - id: draw_watch_chrome
    parameters:
      title: string
    then:
      - lambda: |-
          const int W = id(main_display).get_width();

          // 1. Top-left connectivity dot + title
          Color conn_col = Color(130, 140, 155); // Gray when WiFi radio sleeping offline
          if (id(wifi_client).is_connected()) {
            conn_col = id(ha_api).is_connected() ? Color(46, 204, 113) : Color(255, 175, 40);
          } else if (!id(wifi_sleeping_offline)) {
            conn_col = Color(255, 70, 70); // Searching for WiFi
          }
          id(main_display).filled_circle(52, 36, 5, conn_col);
          id(main_display).printf(66, 36, id(font_ui_label), Color(160, 175, 195), TextAlign::CENTER_LEFT, "%s", title.c_str());

          // 2. Top-right Battery Gauge
          const int w = 50;
          const int h = 20;
          const int capw = 4;
          const int caph = 10;
          const int pad = 3;
          const int x = W - 46 - (w + capw);
          const int y = 26;

          float pct = isnan(id(bat_pct).state) ? 0.0f : id(bat_pct).state;
          if (pct < 0.0f) pct = 0.0f;
          if (pct > 100.0f) pct = 100.0f;
          const bool chg = id(charging).state;

          Color lvl = Color(230, 235, 245);
          if (chg) lvl = Color(46, 213, 115);
          else if (pct < 20.0f) lvl = Color(255, 71, 87);
          else if (pct < 50.0f) lvl = Color(255, 165, 2);

          id(main_display).rectangle(x, y, w, h, Color(180, 190, 205));
          id(main_display).rectangle(x + w, y + (h - caph) / 2, capw, caph, Color(180, 190, 205));

          int inw = w - 2 * pad;
          int inh = h - 2 * pad;
          int fw = (int)(inw * (pct / 100.0f));
          if (fw > 0) {
            id(main_display).filled_rectangle(x + pad, y + pad, fw, inh, lvl);
          }

          char btxt[10];
          if (chg) {
            snprintf(btxt, sizeof(btxt), "+%d%%", (int)(pct + 0.5f));
          } else {
            snprintf(btxt, sizeof(btxt), "%d%%", (int)(pct + 0.5f));
          }
          id(main_display).printf(x - 6, y + h / 2, id(font_ui_label), Color(200, 210, 225), TextAlign::CENTER_RIGHT, "%s", btxt);

          // 3. Bottom Navigation Bar (<  • ○ ○ ○  >)
          const int nav_y = 468;
          id(main_display).printf(54, nav_y, id(font_clock_small), Color(120, 140, 170), TextAlign::CENTER, "<");
          id(main_display).printf(W - 54, nav_y, id(font_clock_small), Color(120, 140, 170), TextAlign::CENTER, ">");

          const int dot_xs[4] = {186, 206, 226, 246};
          for (int i = 0; i < 4; i++) {
            if (i == id(current_page_index)) {
              id(main_display).filled_circle(dot_xs[i], nav_y, 5, Color(80, 190, 255));
            } else {
              id(main_display).circle(dot_xs[i], nav_y, 4, Color(90, 105, 125));
            }
          }

display:
  - platform: mipi_spi
    id: main_display
    model: AXS15231
    cs_pin: 12
    reset_pin: 8
    update_interval: never

    dimensions:
      width: 432
      height: 504

    data_rate: 80MHz
    color_order: rgb

    init_sequence:
      - [0x11]              # Sleep Out
      - [0xFE, 0x00]
      - [0xC4, 0x80]        # SPI Mode Control
      - [0x53, 0x20]        # CTRL Display1
      - [0x63, 0xFF]        # Brightness HBM
      - [0x29]              # Display On
      - [0x51, 0xD0]        # Brightness Normal
      - [0x58, 0x00]        # WCE: Contrast Enhancement Off

    pages:
      # ========================================================================
      # PAGE 0: REAL-TIME CLOCK & QUICK STATUS (HH:MM:SS)
      # ========================================================================
      - id: clock_page
        lambda: |-
          it.fill(Color::BLACK);
          id(draw_watch_chrome).execute("CLOCK");

          // Resolve current time: HA -> SNTP -> PCF85063 hardware RTC
          auto time = id(ha_time).now();
          if (!time.is_valid()) {
            time = id(sntp_time).now();
          }
          if (!time.is_valid()) {
            time = id(rtc_time).now();
          }

          bool wifi_ok = id(wifi_client).is_connected();
          bool ha_ok = id(ha_api).is_connected();

          if (time.is_valid()) {
            // Date above
            it.strftime(216, 138, id(font_clock_date), Color(190, 205, 225), TextAlign::CENTER, "%a, %b %d", time);

            // Real-time HH:MM:SS in center
            it.strftime(216, 215, id(font_clock_time), Color::WHITE, TextAlign::CENTER, "%H:%M:%S", time);

            // Subtle Wi-Fi + SD Card status line (Tap y=270..315 to wake Wi-Fi immediately when offline)
            char sd_tag[20] = "";
            if (id(sd_mounted).state && id(sd_total_mb).state > 0.0f) {
              if (id(sd_total_mb).state >= 1024.0f) {
                snprintf(sd_tag, sizeof(sd_tag), " • SD %.1fG", id(sd_total_mb).state / 1024.0f);
              } else {
                snprintf(sd_tag, sizeof(sd_tag), " • SD %.0fM", id(sd_total_mb).state);
              }
            }
            if (wifi_ok && id(wifi_ssid).has_state()) {
              std::string status = "WiFi: " + id(wifi_ssid).state + sd_tag;
              it.printf(216, 285, id(font_ui_label), Color(90, 140, 220), TextAlign::CENTER, "%s", status.c_str());
            } else if (id(wifi_sleeping_offline)) {
              it.printf(216, 285, id(font_ui_label), Color(135, 145, 160), TextAlign::CENTER, "Offline (RTC)%s • Tap WiFi", sd_tag);
            } else {
              it.printf(216, 285, id(font_ui_label), Color(220, 165, 60), TextAlign::CENTER, "Searching WiFi...%s", sd_tag);
            }
          } else {
            it.printf(216, 215, id(font_clock_date), Color::WHITE, TextAlign::CENTER, "Syncing Time...");
          }

          // Quick On-Air / In-Meeting Status Pill (Touchable: y=330..380)
          bool on_air = id(on_air_local_state);
          if (ha_ok) {
            Color pill_bg = on_air ? Color(185, 28, 42) : Color(24, 34, 48);
            Color pill_border = on_air ? Color(255, 90, 100) : Color(60, 80, 105);
            it.filled_rectangle(82, 332, 268, 48, pill_bg);
            it.rectangle(82, 332, 268, 48, pill_border);
            it.printf(216, 356, id(font_clock_small), Color::WHITE, TextAlign::CENTER,
                      on_air ? "IN MEETING: ON AIR" : "STATUS: AVAILABLE");
          } else {
            Color pill_bg = on_air ? Color(135, 28, 38) : Color(22, 26, 32);
            Color pill_border = on_air ? Color(220, 85, 95) : Color(65, 70, 80);
            it.filled_rectangle(82, 332, 268, 48, pill_bg);
            it.rectangle(82, 332, 268, 48, pill_border);
            it.printf(216, 356, id(font_clock_small), Color(185, 190, 200), TextAlign::CENTER,
                      on_air ? "ON AIR (HA OFFLINE)" : "HA OFFLINE • TAP ON AIR");
          }

          // Quick Voice Assistant / Reconnect Pill (Touchable: y=392..438)
          if (ha_ok) {
            it.filled_rectangle(106, 392, 220, 44, Color(18, 42, 66));
            it.rectangle(106, 392, 220, 44, Color(65, 165, 245));
            it.printf(216, 414, id(font_ui_label), Color(130, 205, 255), TextAlign::CENTER, "TAP FOR VOICE ASSIST");
          } else {
            it.filled_rectangle(106, 392, 220, 44, Color(28, 34, 44));
            it.rectangle(106, 392, 220, 44, Color(90, 105, 125));
            it.printf(216, 414, id(font_ui_label), Color(170, 185, 205), TextAlign::CENTER, "TAP TO RECONNECT WIFI");
          }

          id(draw_active_timer_widget).execute();
          id(draw_timer_timeline).execute();

      # ========================================================================
      # PAGE 1: HOME ASSISTANT WEATHER SCREEN
      # ========================================================================
      - id: weather_page
        lambda: |-
          it.fill(Color::BLACK);
          bool ha_ok = id(ha_api).is_connected();
          id(draw_watch_chrome).execute(ha_ok ? "WEATHER" : "WEATHER (OFFLINE)");

          std::string cond = id(ha_weather_condition).has_state() ? id(ha_weather_condition).state : (ha_ok ? "unknown" : "offline");

          // Draw Vector Weather Icon around (216, 145)
          int cx = 216, cy = 140;
          if (cond.find("rain") != std::string::npos || cond.find("pouring") != std::string::npos) {
            it.filled_circle(cx - 18, cy, 22, Color(150, 165, 185));
            it.filled_circle(cx + 8, cy - 8, 26, Color(175, 190, 210));
            it.filled_circle(cx + 28, cy + 4, 18, Color(150, 165, 185));
            it.filled_rectangle(cx - 20, cy + 4, 50, 18, Color(165, 180, 200));
            it.line(cx - 12, cy + 28, cx - 18, cy + 44, Color(70, 170, 255));
            it.line(cx + 4,  cy + 28, cx - 2,  cy + 44, Color(70, 170, 255));
            it.line(cx + 20, cy + 28, cx + 14, cy + 44, Color(70, 170, 255));
          } else if (cond.find("cloud") != std::string::npos || cond.find("fog") != std::string::npos || cond.find("overcast") != std::string::npos) {
            if (cond.find("partly") != std::string::npos) {
              it.filled_circle(cx - 22, cy - 12, 22, Color(255, 195, 18));
            }
            it.filled_circle(cx - 16, cy + 4, 22, Color(180, 195, 215));
            it.filled_circle(cx + 10, cy - 4, 28, Color(210, 220, 235));
            it.filled_circle(cx + 30, cy + 8, 18, Color(180, 195, 215));
            it.filled_rectangle(cx - 18, cy + 8, 50, 18, Color(195, 205, 225));
          } else if (cond.find("snow") != std::string::npos) {
            it.filled_circle(cx - 16, cy, 22, Color(190, 205, 225));
            it.filled_circle(cx + 10, cy - 6, 26, Color(220, 230, 245));
            it.filled_circle(cx - 10, cy + 36, 4, Color::WHITE);
            it.filled_circle(cx + 8,  cy + 40, 4, Color::WHITE);
            it.filled_circle(cx + 24, cy + 34, 4, Color::WHITE);
          } else {
            // Sunny / Clear
            it.filled_circle(cx, cy, 32, Color(255, 195, 18));
            it.circle(cx, cy, 38, Color(255, 145, 0));
          }

          // Temperature Display
          if (!isnan(id(ha_weather_temp).state)) {
            it.printf(216, 245, id(font_clock_time), Color::WHITE, TextAlign::CENTER, "%.0f°", id(ha_weather_temp).state);
          } else {
            it.printf(216, 245, id(font_clock_time), Color(160, 160, 160), TextAlign::CENTER, "--°");
          }

          // Condition Label (capitalize first letter)
          std::string label = cond;
          if (!label.empty() && label[0] >= 'a' && label[0] <= 'z') {
            label[0] = label[0] - 'a' + 'A';
          }
          it.printf(216, 315, id(font_clock_date), Color(130, 200, 255), TextAlign::CENTER, "%s", label.c_str());

          // Bottom Metric Cards (Humidity & Wind Speed)
          it.filled_rectangle(75, 358, 132, 72, Color(22, 32, 46));
          it.rectangle(75, 358, 132, 72, Color(55, 75, 100));
          it.printf(141, 376, id(font_ui_label), Color(150, 170, 195), TextAlign::CENTER, "HUMIDITY");
          if (!isnan(id(ha_weather_humidity).state)) {
            it.printf(141, 405, id(font_clock_date), Color::WHITE, TextAlign::CENTER, "%.0f%%", id(ha_weather_humidity).state);
          } else {
            it.printf(141, 405, id(font_clock_date), Color(130, 130, 130), TextAlign::CENTER, "--%%");
          }

          it.filled_rectangle(225, 358, 132, 72, Color(22, 32, 46));
          it.rectangle(225, 358, 132, 72, Color(55, 75, 100));
          it.printf(291, 376, id(font_ui_label), Color(150, 170, 195), TextAlign::CENTER, "WIND");
          if (!isnan(id(ha_weather_wind).state)) {
            it.printf(291, 405, id(font_clock_small), Color::WHITE, TextAlign::CENTER, "%.1f mph", id(ha_weather_wind).state);
          } else {
            it.printf(291, 405, id(font_clock_small), Color(130, 130, 130), TextAlign::CENTER, "--");
          }

      # ========================================================================
      # PAGE 2: IN-MEETING / ON-AIR LIGHT CONTROLLER
      # ========================================================================
      - id: meeting_page
        lambda: |-
          it.fill(Color::BLACK);
          id(draw_watch_chrome).execute("ON AIR");

          bool ha_ok = id(ha_api).is_connected();
          bool on_air = id(on_air_local_state);

          Color card_bg = on_air ? Color(195, 24, 38) : Color(20, 68, 52);
          Color card_border = on_air ? Color(255, 110, 120) : Color(46, 213, 115);

          // Large Center Toggle Button (x=72..360, y=135..375)
          it.filled_rectangle(72, 135, 288, 240, card_bg);
          it.rectangle(72, 135, 288, 240, card_border);
          it.rectangle(74, 137, 284, 236, card_border);

          // Status Dot + Main Heading
          it.filled_circle(216, 185, 16, Color::WHITE);
          if (on_air) {
            it.filled_circle(216, 185, 10, Color(255, 40, 55));
            it.printf(216, 248, id(font_clock_time), Color::WHITE, TextAlign::CENTER, "ON AIR");
            it.printf(216, 305, id(font_clock_date), Color(255, 225, 225), TextAlign::CENTER,
                      ha_ok ? "In Meeting" : "In Meeting (HA Sync)");
            it.printf(216, 348, id(font_ui_label), Color(255, 200, 200), TextAlign::CENTER, "TAP CENTER TO TURN OFF");
          } else {
            it.filled_circle(216, 185, 10, Color(46, 213, 115));
            it.printf(216, 248, id(font_clock_time), Color::WHITE, TextAlign::CENTER, "OFF AIR");
            it.printf(216, 305, id(font_clock_date), Color(210, 250, 225), TextAlign::CENTER,
                      ha_ok ? "Available" : "Available (HA Sync)");
            it.printf(216, 348, id(font_ui_label), Color(180, 235, 205), TextAlign::CENTER, "TAP CENTER TO TURN ON");
          }

          it.printf(216, 412, id(font_ui_label), Color(120, 135, 155), TextAlign::CENTER,
                    ha_ok ? "HA Connected • Tap to Toggle" : "Waiting for Home Assistant API");

      # ========================================================================
      # PAGE 3: MINI ESPHOME CONTROL & DIAGNOSTICS GRID
      # ========================================================================
      - id: controls_page
        lambda: |-
          it.fill(Color::BLACK);
          id(draw_watch_chrome).execute("CONTROLS");

          auto draw_tile = [&](int x, int y, int w, int h, const char *label, const char *val, Color bg, Color border) {
            it.filled_rectangle(x, y, w, h, bg);
            it.rectangle(x, y, w, h, border);
            it.printf(x + w / 2, y + 26, id(font_ui_label), Color(185, 200, 220), TextAlign::CENTER, "%s", label);
            it.printf(x + w / 2, y + 56, id(font_clock_small), Color::WHITE, TextAlign::CENTER, "%s", val);
          };

          // Row 1 (y=90..172): On-Air Toggle | Mic Mute Toggle
          bool on_air = id(on_air_local_state);
          draw_tile(75, 90, 132, 82, "ON AIR", on_air ? "ACTIVE" : "OFF",
                    on_air ? Color(175, 28, 42) : Color(24, 34, 48),
                    on_air ? Color(255, 95, 105) : Color(65, 85, 110));

          bool muted = id(mute).state;
          draw_tile(225, 90, 132, 82, "MIC MUTE", muted ? "MUTED" : "LIVE",
                    muted ? Color(165, 85, 20) : Color(24, 52, 42),
                    muted ? Color(255, 165, 50) : Color(46, 204, 113));

          // Row 2 (y=185..267): Brightness Preset | Volume Preset
          float bri = id(screen_brightness).state;
          const char *bri_str = (bri < 100.0f) ? "LOW (25%)" : (bri < 210.0f ? "MED (65%)" : "HIGH (100%)");
          draw_tile(75, 185, 132, 82, "BRIGHTNESS", bri_str,
                    Color(26, 38, 56), Color(80, 140, 210));

          const char *vol_strs[4] = {"25%", "50%", "75%", "100%"};
          int v_idx = id(volume_step_index) % 4;
          draw_tile(225, 185, 132, 82, "VOLUME", vol_strs[v_idx],
                    Color(26, 38, 56), Color(80, 140, 210));

          // Row 3 (y=280..362): Voice Assistant | Display Sleep
          draw_tile(75, 280, 132, 82, "ASSISTANT", "START VA",
                    Color(20, 55, 85), Color(70, 185, 255));

          draw_tile(225, 280, 132, 82, "DISPLAY", "SLEEP NOW",
                    Color(42, 30, 62), Color(150, 110, 220));

          // Row 4 Diagnostics & Actions (y=375..438): SD Card Status | Restart Watch
          char sd_buf[24];
          if (id(sd_mounted).state && id(sd_total_mb).state > 0.0f) {
            if (id(sd_total_mb).state >= 1024.0f) {
              snprintf(sd_buf, sizeof(sd_buf), "%.1f GB", id(sd_total_mb).state / 1024.0f);
            } else {
              snprintf(sd_buf, sizeof(sd_buf), "%.0f/%.0fMB", id(sd_free_mb).state, id(sd_total_mb).state);
            }
          } else {
            snprintf(sd_buf, sizeof(sd_buf), "NO CARD");
          }
          draw_tile(75, 375, 132, 64, "SD CARD", sd_buf,
                    id(sd_mounted).state ? Color(20, 48, 38) : Color(20, 28, 38),
                    id(sd_mounted).state ? Color(46, 204, 113) : Color(60, 75, 95));

          char diag_buf[20];
          if (!isnan(id(bat_v).state)) {
            snprintf(diag_buf, sizeof(diag_buf), "%.2fV / RST", id(bat_v).state);
          } else {
            snprintf(diag_buf, sizeof(diag_buf), "TAP RESTART");
          }
          draw_tile(225, 375, 132, 64, "REBOOT", diag_buf,
                    Color(48, 24, 28), Color(160, 70, 80));

      # ========================================================================
      # VOICE ASSISTANT OVERLAY PAGES (Centered for 410x502)
      # ========================================================================
      - id: idle_page
        lambda: |-
          it.fill(id(idle_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_idle), ImageAlign::CENTER);
          id(draw_timer_timeline).execute();
          id(draw_active_timer_widget).execute();
      - id: listening_page
        lambda: |-
          it.fill(id(listening_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_listening), ImageAlign::CENTER);
          id(draw_timer_timeline).execute();
      - id: thinking_page
        lambda: |-
          it.fill(id(thinking_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_thinking), ImageAlign::CENTER);
          if (id(show_text).state) {
            it.filled_rectangle(56, 36, 320, 40, Color::WHITE);
            it.rectangle(56, 36, 320, 40, Color::BLACK);
            it.printf(216, 56, id(font_request), Color::BLACK, TextAlign::CENTER, "%s", id(text_request).state.c_str());
          }
          id(draw_timer_timeline).execute();
      - id: replying_page
        lambda: |-
          it.fill(id(replying_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_replying), ImageAlign::CENTER);
          if (id(show_text).state) {
            it.filled_rectangle(56, 400, 320, 40, Color::WHITE);
            it.rectangle(56, 400, 320, 40, Color::BLACK);
            it.printf(216, 420, id(font_response), Color::BLACK, TextAlign::CENTER, "%s", id(text_response).state.c_str());
          }
          id(draw_timer_timeline).execute();
      - id: timer_finished_page
        lambda: |-
          it.fill(id(idle_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_timer_finished), ImageAlign::CENTER);
      - id: error_page
        lambda: |-
          it.fill(id(error_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_error), ImageAlign::CENTER);
      - id: no_ha_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_ha), ImageAlign::CENTER);
      - id: no_wifi_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_wifi), ImageAlign::CENTER);
      - id: initializing_page
        lambda: |-
          it.fill(id(loading_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_initializing), ImageAlign::CENTER);
      - id: muted_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_muted), ImageAlign::CENTER);
          id(draw_timer_timeline).execute();
          id(draw_active_timer_widget).execute();
      - id: now_playing_page
        lambda: |-
          it.fill(Color::BLACK);
          it.printf(216, 250, id(font_response), Color::WHITE, TextAlign::CENTER, "Media Player is Playing...");
